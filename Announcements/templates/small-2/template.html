<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>{{ title | default("A4 Tear-Off Announcement") }}</title>

    <style>
        @page {
            size: 210mm 89mm;
            margin: 0;
        }

        :root {
            --base-font-size: 11pt;
            --tab-font-size: 10pt;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 210mm;
            height: 89mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* Main announcement area */
        .main {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            font-size: var(--base-font-size);
        }

        .main h1, h2, h3, h4, h5, p {
            margin-block-start: 0.2em;
            margin-block-end: 0.2em;
        }

        /* Tear-off section */
        .tearoff-section {
            height: 42mm;
            border-top: 1px dashed #111;
            display: flex;
        }

        .tab {
            flex: 1;
            border-left: 1px dashed #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4mm 2mm;
            font-size: var(--tab-font-size);
            font-weight: bold;
            text-align: center;

            position: relative;
            overflow: hidden;   /* prevents rotated text from expanding layout */
        }

        .tab-label {
            position: absolute;
            left: 50%;
            top: 50%;

            display: inline-block;
            white-space: nowrap;

            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }

        .tab:last-child {
            border-left: none;
        }

        .tab small {
            font-size: 9pt;
            font-weight: normal;
            margin-top: 3mm;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="main">
        {% if announcement_text is not none %}
        {{ announcement_text | safe }}
        {% endif %}
    </section>

    <section class="tearoff-section">
        {% for item in tearoff_items %}
        <div class="tab"
             style="{% if item.style %} {{ item.style }} {% endif %}">
            <span class="tab-label">{{ item.l1 }}</span>
        </div>
        {% endfor %}
    </section>

</div>
</body>
</html>
