<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>{{ title | default("A4 Tear-Off Announcement") }}</title>

    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 297mm;
            height: 210mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* Main announcement area */
        .main {
            flex: 1;
            padding: 14mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .main h1 {
            font-size: 34pt;
            margin: 0 0 12mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main .subtitle {
            font-size: 20pt;
            font-weight: bold;
            margin-bottom: 10mm;
        }

        .main .text {
            font-size: 15pt;
            line-height: 1.45;
            margin-bottom: 10mm;
        }

        .main .highlight {
            font-size: 18pt;
            font-weight: bold;
            margin-top: 8mm;
        }

        /* Tear-off section */
        .tearoff-section {
            height: 60mm;
            border-top: 1px dashed #111;
            display: flex;
        }

        .tab {
            flex: 1;
            border-left: 1px dashed #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4mm 2mm;
            font-size: 16pt;
            font-weight: bold;
            text-align: center;

            position: relative;
            overflow: hidden;   /* prevents rotated text from expanding layout */
        }

        .tab-label {
            position: absolute;
            left: 50%;
            top: 50%;

            display: inline-block;
            white-space: nowrap;

            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }

        .tab:last-child {
            border-left: none;
        }

        .tab small {
            font-size: 9pt;
            font-weight: normal;
            margin-top: 3mm;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="main">
        {% if announcement_text is not none %}
        {{ announcement_text | safe }}
        {% endif %}
    </section>

    <section class="tearoff-section">
        {% for item in tearoff_items %}
        <div class="tab"
             style="{% if item.style %} {{ item.style }} {% endif %}">
            <span class="tab-label">{{ item.l1 }}</span>
        </div>
        {% endfor %}
    </section>

</div>
</body>
</html>
