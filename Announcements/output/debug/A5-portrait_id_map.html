<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>A4 Tear-Off Announcement</title>

    <style>
        @page {
            size: A5 portrait;
            margin: 0;
        }

        :root {
            --base-font-size: 26pt;
            --tab-font-size: 16pt;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 148mm;
            height: 210mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* Main announcement area */
        .main {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            font-size: var(--base-font-size);
        }

        .main h1, h2, h3, h4, h5, p {
            margin-block-start: 0.2em;
            margin-block-end: 0.2em;
        }

        /* Tear-off section */
        .tearoff-section {
            height: 42mm;
            border-top: 1px dashed #111;
            display: flex;
        }

        .tab {
            flex: 1;
            border-left: 1px dashed #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4mm 2mm;
            font-size: var(--tab-font-size);
            font-weight: bold;
            text-align: center;

            position: relative;
            overflow: hidden;   /* prevents rotated text from expanding layout */
        }

        .tab-label {
            position: absolute;
            left: 50%;
            top: 50%;

            display: inline-block;
            white-space: nowrap;

            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }

        .tab:last-child {
            border-left: none;
        }

        .tab small {
            font-size: 9pt;
            font-weight: normal;
            margin-top: 3mm;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="main">
        
    </section>

    <section class="tearoff-section">
        
        <div class="tab"
             style=" background-color: rgb(8%, 8%, 8%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(24%, 24%, 24%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(89%, 89%, 89%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(0%, 0%, 0%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(43%, 43%, 43%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(93%, 93%, 93%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(33%, 33%, 33%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(71%, 71%, 71%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(90%, 90%, 90%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(70%, 70%, 70%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"

        </div>
        
        <div class="tab"

        </div>
        
        <div class="tab"
             style=" background-color: rgb(50%, 50%, 50%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(40%, 40%, 40%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(91%, 91%, 91%); ">
            <span class="tab-label"></span>
        </div>
        
    </section>

</div>
</body>
</html>
