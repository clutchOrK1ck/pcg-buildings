<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>A4 Tear-Off Announcement</title>

    <style>
        @page {
            size: 210mm 89mm;
            margin: 0;
        }

        :root {
            --base-font-size: 11pt;
            --tab-font-size: 10pt;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 210mm;
            height: 89mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* Main announcement area */
        .main {
            flex: 1;
            padding: 14mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .main h1 {
            font-size: calc(var(--base-font-size) * 1.4);
            margin: 0 0 12mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main .subtitle {
            font-size: calc(var(--base-font-size) * 1.2);
            font-weight: bold;
            margin-bottom: 10mm;
        }

        .main .text {
            font-size: var(--base-font-size);
            line-height: 1.45;
            margin-bottom: 10mm;
        }

        .main .highlight {
            font-size: calc(var(--base-font-size) * 1.2);
            font-weight: bold;
            margin-top: 8mm;
        }

        /* Tear-off section */
        .tearoff-section {
            height: 42mm;
            border-top: 1px dashed #111;
            display: flex;
        }

        .tab {
            flex: 1;
            border-left: 1px dashed #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4mm 2mm;
            font-size: var(--tab-font-size);
            font-weight: bold;
            text-align: center;

            position: relative;
            overflow: hidden;   /* prevents rotated text from expanding layout */
        }

        .tab-label {
            position: absolute;
            left: 50%;
            top: 50%;

            display: inline-block;
            white-space: nowrap;

            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }

        .tab:last-child {
            border-left: none;
        }

        .tab small {
            font-size: 9pt;
            font-weight: normal;
            margin-top: 3mm;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="main">
        
    </section>

    <section class="tearoff-section">
        
        <div class="tab"
             style=" background-color: rgb(74%, 74%, 74%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(34%, 34%, 34%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(81%, 81%, 81%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(44%, 44%, 44%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(1%, 1%, 1%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(99%, 99%, 99%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(10%, 10%, 10%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(71%, 71%, 71%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(56%, 56%, 56%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(75%, 75%, 75%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(46%, 46%, 46%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(18%, 18%, 18%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(54%, 54%, 54%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(49%, 49%, 49%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(53%, 53%, 53%); ">
            <span class="tab-label"></span>
        </div>
        
    </section>

</div>
</body>
</html>
