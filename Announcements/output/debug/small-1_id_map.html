<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>A4 Tear-Off Announcement</title>

    <style>
        @page {
            size: 84mm 148mm;
            margin: 0;
        }

        :root {
            --base-font-size: 16pt;
            --tab-font-size: 14pt;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 84mm;
            height: 148mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* Main announcement area */
        .main {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            font-size: var(--base-font-size);
        }

        .main h1, h2, h3, h4, h5, p {
            margin-block-start: 0.2em;
            margin-block-end: 0.2em;
        }

        /* Tear-off section */
        .tearoff-section {
            height: 42mm;
            border-top: 1px dashed #111;
            display: flex;
        }

        .tab {
            flex: 1;
            border-left: 1px dashed #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4mm 2mm;
            font-size: var(--tab-font-size);
            font-weight: bold;
            text-align: center;

            position: relative;
            overflow: hidden;   /* prevents rotated text from expanding layout */
        }

        .tab-label {
            position: absolute;
            left: 50%;
            top: 50%;

            display: inline-block;
            white-space: nowrap;

            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }

        .tab:last-child {
            border-left: none;
        }

        .tab small {
            font-size: 9pt;
            font-weight: normal;
            margin-top: 3mm;
        }

        @media print {
            body {
                background: white;
            }

            .page {
                margin: 0;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <section class="main">
        
    </section>

    <section class="tearoff-section">
        
        <div class="tab"
             style=" background-color: rgb(52%, 52%, 52%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(82%, 82%, 82%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(9%, 9%, 9%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(89%, 89%, 89%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(14%, 14%, 14%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(10%, 10%, 10%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(100%, 100%, 100%); ">
            <span class="tab-label"></span>
        </div>
        
        <div class="tab"
             style=" background-color: rgb(42%, 42%, 42%); ">
            <span class="tab-label"></span>
        </div>
        
    </section>

</div>
</body>
</html>
